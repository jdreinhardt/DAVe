services:
  # Baikal DAV server for integration and E2E tests.
  # Runs on port 8801 (distinct from the dev stack's 8800) to avoid collisions.
  baikal:
    image: ckulka/baikal:nginx
    ports:
      - '8801:80'
    volumes:
      - baikal-test-config:/var/www/baikal/config
      - baikal-test-data:/var/www/baikal/Specific
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost/ && exit 0 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # One-shot init container: configures Baikal for Basic auth and seeds test data.
  # Uses service_completed_successfully so the main app waits for it before starting.
  baikal-init:
    image: ckulka/baikal:nginx
    depends_on:
      baikal:
        condition: service_healthy
    volumes:
      - baikal-test-config:/var/www/baikal/config
      - baikal-test-data:/var/www/baikal/Specific
      - ./scripts/seed-test.sh:/seed-test.sh:ro
    environment:
      - BAIKAL_INTERNAL_URL=http://baikal/dav.php
    entrypoint: ['/bin/sh', '/seed-test.sh']

volumes:
  baikal-test-config:
  baikal-test-data:

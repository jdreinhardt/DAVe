# ----- Radicale
  radicale:
    image: tomsquest/docker-radicale:3.5.4.0
    ports:
      - '8800:5232'
    volumes:
      - radicale-config:/config
      - radicale-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:5232/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  radicale-config:
  radicale-data:

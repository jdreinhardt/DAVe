name: dave-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app:z
      # Anonymous volumes keep the container's node_modules intact even though
      # the bind mount would otherwise shadow them.
      - /app/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/backend/node_modules
      - /app/packages/frontend/node_modules
    ports:
      - '3000:3000' # Fastify backend / API
      - '5173:5173' # Vite dev server (frontend + HMR)
    environment:
      - NODE_ENV=development
      # Use the DAV_BASE_URL for the backend you want to test.
      # Radicale enabled by default due to simplicity in standup for testing
      # - DAV_BASE_URL=http://baikal/dav.php
      - DAV_BASE_URL=http://radicale:5232
      - SESSION_SECRET=dev-only-secret-not-for-production-must-be-32-chars
      - SESSION_TTL_HOURS=168
      - PORT=3000
      - BIND_ADDRESS=0.0.0.0
      - DATA_DIR=/app/.dev-data
    depends_on:
      radicale:
        condition: service_healthy
    command: npm run dev

# Uncomment one of the backends for a fully local dev stack. Also, uncomment the
# DAV_BASE_URL in the app service.
# See scripts/seed-test-<backend>.sh for the config shape
# Test backend can also be deployed with docker-compose.test.<backend>.yml


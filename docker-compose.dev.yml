services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      # Bind-mount source for hot reload.
      - .:/app
      # Anonymous volumes keep the container's node_modules intact even though
      # the bind mount would otherwise shadow them.
      - /app/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/backend/node_modules
      - /app/packages/frontend/node_modules
    ports:
      - '3000:3000' # Fastify backend / API
      - '5173:5173' # Vite dev server (frontend + HMR)
    environment:
      - NODE_ENV=development
      - BAIKAL_BASE_URL=http://baikal/dav.php
      - SESSION_SECRET=dev-only-secret-not-for-production-must-be-32-chars
      - SESSION_TTL_HOURS=168
      - PORT=3000
      - BIND_ADDRESS=0.0.0.0
      - DATA_DIR=/app/.dev-data
    depends_on:
      baikal:
        condition: service_healthy
    command: npm run dev

  baikal:
    image: ckulka/baikal:nginx
    ports:
      - '8800:80' # Baikal web UI (admin + DAV)
    volumes:
      - baikal-config:/var/www/baikal/config
      - baikal-data:/var/www/baikal/Specific
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost/ -o /dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  baikal-config:
  baikal-data:
